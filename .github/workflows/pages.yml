name: Deploy Pages

# 데이터 수집(fetch.ps1)은 eiass.go.kr이 해외 IP를 차단하기 때문에 반드시 국내 PC에서 실행해야 합니다.
# 이 워크플로는 로컬 PC가 push한 site/ 폴더를 그대로 GitHub Pages에 배포만 합니다.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
