name: Update data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"   # 매일 UTC 22:00 (KST 07:00)에 자동 갱신
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest EIASS data
        shell: pwsh
        run: ./fetch.ps1 -NoOpen

      - name: Commit updated data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/new_log.json site/index.html
          git diff --cached --quiet || git commit -m "chore: EIASS 채석/토석채취 사업 데이터 갱신"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
