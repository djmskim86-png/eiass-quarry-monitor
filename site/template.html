<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>채석단지·토석채취 사업 모니터링</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f5f6f4;
    --card: #ffffff;
    --border: #e2e5e0;
    --text: #1f2421;
    --sub: #6b7268;
    --accent: #4a7c59;
    --accent-dark: #34573e;
    --new: #d97706;
    --changed: #2563eb;
    --danger: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Malgun Gothic", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 20px 60px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--sub); font-size: 13px; margin-bottom: 20px; }
  .stats {
    display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px;
  }
  .stat-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 18px; min-width: 120px;
  }
  .stat-card .num { font-size: 22px; font-weight: 700; }
  .stat-card .lbl { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .stat-card.new .num { color: var(--new); }
  .stat-card.changed .num { color: var(--changed); }

  .controls {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; margin-bottom: 16px;
  }
  .controls input[type=text] {
    flex: 1; min-width: 180px; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px;
  }
  .controls select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
    background: white;
  }
  .controls label.chk { font-size: 13px; display: flex; align-items: center; gap: 4px; color: var(--sub); }

  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  thead th {
    text-align: left; font-size: 12px; color: var(--sub); background: #eef1ec;
    padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #f7f9f6; cursor: pointer; }
  .name-link { color: var(--accent-dark); text-decoration: none; font-weight: 500; }
  .name-link:hover { text-decoration: underline; }
  .badge {
    display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 999px;
    font-weight: 700; margin-right: 6px; vertical-align: middle;
  }
  .badge.new { background: #fef3c7; color: var(--new); }
  .badge.changed { background: #dbeafe; color: var(--changed); }
  .status-pill {
    display: inline-block; font-size: 12px; padding: 3px 9px; border-radius: 999px;
    background: #eef1ec; color: var(--text); white-space: nowrap;
  }
  .status-pill.done { background: #e6f4ea; color: var(--accent-dark); }
  .empty { text-align: center; padding: 40px; color: var(--sub); }
  .footer-note { margin-top: 18px; font-size: 12px; color: var(--sub); line-height: 1.6; }
  .footer-note code { background: #eef1ec; padding: 1px 5px; border-radius: 4px; }
  .count-note { font-size: 12px; color: var(--sub); margin: 8px 2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>채석단지 · 토석채취 사업 모니터링</h1>
  <div class="subtitle">환경영향평가정보지원시스템(EIASS) · 사업구분: 토석·모래·자갈·광물 등의 채취(코드 Q) · 마지막 갱신: <span id="fetchedAt"></span></div>

  <div class="stats">
    <div class="stat-card"><div class="num" id="statTotal">0</div><div class="lbl">전체 사업</div></div>
    <div class="stat-card new"><div class="num" id="statNew">0</div><div class="lbl">이번에 새로 발견</div></div>
    <div class="stat-card changed"><div class="num" id="statChanged">0</div><div class="lbl">진행현황 변경</div></div>
  </div>

  <div class="controls">
    <input type="text" id="qName" placeholder="사업명 검색 (예: 채석단지, 회사명 등)">
    <select id="qRegion"><option value="">전체 지역(협의기관)</option></select>
    <select id="qStatus">
      <option value="">전체 진행현황</option>
      <option value="진행">진행중</option>
      <option value="완료">완료</option>
    </select>
    <label class="chk"><input type="checkbox" id="qNewOnly"> 신규만 보기</label>
    <label class="chk"><input type="checkbox" id="qChangedOnly"> 상태변경만 보기</label>
  </div>

  <div class="count-note" id="resultCount"></div>

  <table>
    <thead>
      <tr>
        <th>사업코드</th>
        <th>지역(협의기관)</th>
        <th>사업명</th>
        <th>접수일</th>
        <th>완료일</th>
        <th>진행현황</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="emptyMsg" style="display:none;">조건에 맞는 사업이 없습니다.</div>

  <div class="footer-note">
    이 페이지는 로컬 스크립트(<code>fetch.ps1</code>)가 생성한 정적 파일입니다. 최신 정보를 다시 가져오려면 <code>run.bat</code>을 실행하세요.<br>
    사업명을 클릭하면 EIASS 원본 상세 페이지가 새 창으로 열립니다.
  </div>
</div>

<script>
const DATA = /*__DATA_JSON__*/null;

function renderStats(d) {
  document.getElementById('fetchedAt').textContent = d.fetchedAt || '-';
  document.getElementById('statTotal').textContent = d.totalCount || 0;
  document.getElementById('statNew').textContent = d.newCount || 0;
  document.getElementById('statChanged').textContent = d.changedCount || 0;
}

function fillRegionOptions(items) {
  const sel = document.getElementById('qRegion');
  const regions = Array.from(new Set(items.map(i => i.region).filter(Boolean))).sort();
  regions.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r; opt.textContent = r;
    sel.appendChild(opt);
  });
}

function esc(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const items = DATA.items || [];
  const qName = document.getElementById('qName').value.trim().toLowerCase();
  const qRegion = document.getElementById('qRegion').value;
  const qStatus = document.getElementById('qStatus').value;
  const qNewOnly = document.getElementById('qNewOnly').checked;
  const qChangedOnly = document.getElementById('qChangedOnly').checked;

  const filtered = items.filter(it => {
    if (qName && !(it.name || '').toLowerCase().includes(qName)) return false;
    if (qRegion && it.region !== qRegion) return false;
    if (qStatus && !(it.status || '').includes(qStatus)) return false;
    if (qNewOnly && !it.isNew) return false;
    if (qChangedOnly && !it.statusChanged) return false;
    return true;
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  document.getElementById('resultCount').textContent = `${filtered.length}건 표시 중 (전체 ${items.length}건)`;

  filtered.forEach(it => {
    const tr = document.createElement('tr');
    const badges = [
      it.isNew ? '<span class="badge new">NEW</span>' : '',
      it.statusChanged ? `<span class="badge changed">변경(이전:${esc(it.prevStatus)})</span>` : ''
    ].join('');
    const statusClass = (it.status || '').includes('완료') ? 'status-pill done' : 'status-pill';
    tr.innerHTML = `
      <td>${esc(it.eiaCd)}</td>
      <td>${esc(it.region)}</td>
      <td>${badges}<a class="name-link" href="${esc(it.detailUrl)}" target="_blank" rel="noopener">${esc(it.name)}</a></td>
      <td>${esc(it.applyDate)}</td>
      <td>${esc(it.completeDate)}</td>
      <td><span class="${statusClass}">${esc(it.status)}</span></td>
    `;
    tr.addEventListener('click', (e) => {
      if (e.target.tagName !== 'A') window.open(it.detailUrl, '_blank');
    });
    tbody.appendChild(tr);
  });

  document.getElementById('emptyMsg').style.display = filtered.length === 0 ? 'block' : 'none';
}

renderStats(DATA);
fillRegionOptions(DATA.items || []);
render();

['qName','qRegion','qStatus'].forEach(id => document.getElementById(id).addEventListener('input', render));
['qNewOnly','qChangedOnly'].forEach(id => document.getElementById(id).addEventListener('change', render));
</script>
</body>
</html>
